name: Build and Test
on: push
jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true
      - name: Install PNG optimizer
        run: sudo apt-get update && sudo apt-get install -y pngquant
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
