name: Test
on: push
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true
      - name: Test
        run: pnpm test
