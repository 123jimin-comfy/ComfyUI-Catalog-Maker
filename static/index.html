<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="ComfyUI Catalog">
  <meta name="robots" content="noindex,nofollow">
  <title>ComfyUI Catalog</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script type="module" src="./assets/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">▦</span> ComfyUI Catalog</a>
    <div class="catalog-picker">
      <label for="catalog-select">Catalog</label>
      <select id="catalog-select" disabled><option>Loading catalogs…</option></select>
    </div>
  </header>
  <main>
    <section class="catalog-heading" aria-labelledby="catalog-title">
      <p class="eyebrow">CATALOG EXPLORER</p>
      <h1 id="catalog-title">Your generated results</h1>
      <p id="catalog-summary" class="summary"></p>
    </section>
    <p id="status" role="status" aria-live="polite">Loading catalogs…</p>
    <div id="gallery" class="gallery" aria-label="Catalog entries"></div>
    <noscript>Enable JavaScript to browse the catalog gallery.</noscript>
  </main>
</body>
</html>
